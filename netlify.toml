# Le site React est dans le sous-dossier projet-final-2023.
[build]
  base = "projet-final-2023"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Toutes les routes (/commande, /compte...) renvoient vers l'application React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
